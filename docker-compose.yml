version: '3.8'

# SAIA Plugin Docker Compose Configuration
# Use this for development, testing, and CI/CD environments.
#
# pi >= 0.84 keeps its state in ~/.pi/agent (settings.json, auth.json), NOT in
# the retired ~/.config/pi layout, so that is what gets mounted/persisted.

services:
  # Production-ready SAIA plugin container
  saia-plugin:
    image: ghcr.io/tobias-weiss-ai-xr/pi-saia-plugin:latest
    container_name: saia-plugin
    environment:
      - NODE_ENV=production
      - SAIA_API_KEY=${SAIA_API_KEY:-}
      - SAIA_PROFILE=${SAIA_PROFILE:-production}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-}
    volumes:
      # Mount your pi configuration for persistence (settings.json, auth.json)
      - ./pi-config:/home/pluginuser/.pi/agent
      # Mount plugin source for development
      - ./:/home/pluginuser/app:ro
    working_dir: /home/pluginuser/app
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - saia-network

  # Development container with build tools
  saia-plugin-dev:
    image: ghcr.io/tobias-weiss-ai-xr/pi-saia-plugin:latest-dev
    container_name: saia-plugin-dev
    environment:
      - NODE_ENV=development
      - SAIA_API_KEY=${SAIA_API_KEY:-}
      - SAIA_PROFILE=${SAIA_PROFILE:-development}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-}
    volumes:
      # Mount your project directory for live editing
      - ./:/home/pluginuser/app
      # Persistent pi state and cache
      - saia-config:/home/pluginuser/.pi/agent
      - saia-cache:/home/pluginuser/.cache/saia
    working_dir: /home/pluginuser/app
    stdin_open: true
    tty: true
    ports:
      # Port for local API testing/mocking
      - "8080:8080"
    networks:
      - saia-network
    profiles:
      - dev

  # Test container for CI/CD
  saia-plugin-test:
    image: ghcr.io/tobias-weiss-ai-xr/pi-saia-plugin:latest
    container_name: saia-plugin-test
    environment:
      - NODE_ENV=test
      - SAIA_API_KEY=mock-test-key
      - SAIA_PROFILE=budget
    volumes:
      - ./:/home/pluginuser/app:ro
    working_dir: /home/pluginuser/app
    command: bash -c "bash test/test.sh && exit 0"
    networks:
      - saia-network
    profiles:
      - test

  # Mock API server for testing without real API key
  saia-mock-api:
    image: python:3.11-alpine
    container_name: saia-mock-api
    command: >
      python3 -c "
      import http.server
      import json
      from http.server import BaseHTTPRequestHandler
      
      class MockHandler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/v1/models':
                  response = {
                      'data': [
                          {'id': 'meta-llama-3.1-8b-instruct'},
                          {'id': 'qwen3.6-35b-a3b'},
                          {'id': 'glm-5.3-flash'},
                          {'id': 'qwen3-coder-next'},
                          {'id': 'qwen3.8-27b'}
                      ]
                  }
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps(response).encode())
              else:
                  self.send_response(404)
                  self.end_headers()
          
          def log_message(self, format, *args):
              pass
      
      server = http.server.HTTPServer(('0.0.0.0', 8080), MockHandler)
      server.serve_forever()
      "
    ports:
      - "8080:8080"
    networks:
      - saia-network
    profiles:
      - mock

volumes:
  # Persistent volumes for configuration and cache
  saia-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./pi-config
  saia-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./saia-cache

networks:
  saia-network:
    driver: bridge

# =============================================================================
# Usage Examples:
# =============================================================================
#
# 1. Start production container:
#    docker compose up saia-plugin
#
# 2. Start development environment:
#    docker compose --profile dev up saia-plugin-dev
#
# 3. Run tests:
#    docker compose --profile test up saia-plugin-test
#
# 4. Start with mock API for testing without real key:
#    docker compose --profile mock up saia-mock-api
#    Then connect to http://localhost:8080/v1/models
#
# 5. Full development setup:
#    docker compose --profile dev --profile mock up
#
# =============================================================================
