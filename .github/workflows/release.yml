name: Release

on:
  push:
    tags:
      # NOTE: these are *glob* filters, not regexes — `+` is literal and
      # `v[0-9]+.[0-9]+.[0-9]+` matches no real tag at all, so releases never
      # fired. Keep this loose enough to trigger, and let the "Validate tag"
      # step below enforce strict semver. Covered by test/test.sh.
      - "v[0-9]*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Work on the default branch, not the detached tag, so the version
          # bump and changelog commit can actually be pushed.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run verify

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate tag is strict semver
        # The tag filter is a glob and has to stay permissive; without this step
        # a tag like `v1` or `v1.0` would be written into package.json as an
        # invalid npm version.
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag v$version is not a plain semver MAJOR.MINOR.PATCH tag; refusing to release."
            exit 1
          fi
          echo "✓ v$version is valid semver"

      - name: Update version and CHANGELOG
        run: |
          version="${{ steps.version.outputs.version }}"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== process.argv[1]) {
              pkg.version = process.argv[1];
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          " "$version"

          # Generate the changelog entry from commits since the previous tag.
          prev_tag=$(git describe --tags --abbrev=0 "v$version^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            commits=$(git log --pretty=format:'* %s (%h)' "$prev_tag..v$version")
          else
            commits=$(git log --pretty=format:'* %s (%h)' -n 50)
          fi

          {
            echo ""
            echo "## [$version] - $(date +%Y-%m-%d)"
            echo ""
            printf '%s\n' "$commits"
          } >> CHANGELOG.md

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json CHANGELOG.md
          git commit -m "Release v$version" || echo "Nothing to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: pi-saia-plugin v${{ steps.version.outputs.version }}
          body_file: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    if: false  # Disabled for now - might publish to npm later
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


