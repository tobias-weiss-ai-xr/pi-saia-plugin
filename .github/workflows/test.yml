name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: [self-hosted, ci-host]
    strategy:
      matrix:
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies (cached)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
          fi

      - name: TypeScript compilation check
        run: npm run tsc

      - name: Install pi CLI
        # test/integration/wire.test.mjs runs the real `pi` against a local mock;
        # without it those tests skip rather than fail. No network to SAIA is
        # involved — the mock speaks the OpenAI protocol.
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Unit + hermetic wire tests (Node test runner)
        run: npm test

      - name: Smoke tests (structure, package manifest, skill frontmatter)
        run: bash test/test.sh

      - name: Shell script syntax check
        run: |
          for script in src/*.sh scripts/*.sh test/test.sh install.sh prepare-release.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" || exit 1
              echo "✓ $script syntax OK"
            fi
          done
          for script in test/*.mjs test/unit/*.mjs test/integration/*.mjs test/lib/*.mjs; do
            [ -f "$script" ] || continue
            node --check "$script" || exit 1
            echo "✓ $script syntax OK"
          done

      - name: Validate JSON schema
        run: |
          npm install -g ajv-cli
          ajv validate -s schema/pi.schema.json -d pi.json.example

      - name: Check file permissions
        run: |
          chmod +x src/*.sh install.sh install.ps1 prepare-release.sh
          echo "✓ Executable permissions set"

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, ci-host]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: install.ps1
